[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clearforge"
version = "0.1.0"
description = "Reproducible English-first language model training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.9,<3", "numpy>=1.26,<3", "tokenizers>=0.22,<0.23"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<0.15", "build>=1.3,<2"]

[project.scripts]
clearforge = "clearforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clearforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
