[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clearforge"
version = "0.1.0"
description = "Reproducible English-first language model training"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sidiora Labs Inc." }]
requires-python = ">=3.11"
dependencies = ["torch>=2.9,<3", "numpy>=1.26,<3", "tokenizers>=0.22,<0.23"]

[project.optional-dependencies]
serving = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
huggingface = ["transformers>=4.57,<5", "safetensors>=0.6,<1"]
dev = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "transformers>=4.57,<5", "safetensors>=0.6,<1", "httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.14,<0.15", "build>=1.3,<2"]

[project.scripts]
clearforge = "clearforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clearforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
