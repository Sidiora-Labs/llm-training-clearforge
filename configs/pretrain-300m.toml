# 304,137,216-parameter pretraining preset. Each update sees 131,072 tokens;
# 50,000 updates cover about 6.5 billion tokens, roughly 21 tokens per
# parameter. Check the budget with `clearforge plan configs/pretrain-300m.toml`.
stage = "pretrain"
data_dir = "../data/packed-pretrain"
tokenizer_path = "../data/tokenizer/tokenizer.json"
output_dir = "../runs/pretrain-300m"

[model]
vocab_size = 32768
hidden_size = 1024
num_layers = 24
num_heads = 16
num_kv_heads = 4
intermediate_size = 2816
max_seq_len = 1024
dropout = 0.0
rope_theta = 10000.0
tie_embeddings = true

[training]
max_steps = 50000
batch_size = 8
accumulation_steps = 16
learning_rate = 0.0003
weight_decay = 0.1
warmup_steps = 1000
min_lr_ratio = 0.1
lr_schedule = "cosine"
grad_clip = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_epsilon = 1e-8
optimizer_fused = true
seed = 42
device = "auto"
precision = "bf16"
data_workers = 2
pin_memory = true
save_every = 500
eval_every = 500
eval_batches = 16
keep_checkpoints = 3
deterministic = true
log_every = 10
