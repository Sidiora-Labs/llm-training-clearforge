# Full-parameter chat fine-tuning of the matching native 1B base model.
# Each update sees 65,536 tokens of assistant-supervised conversation.
stage = "sft"
data_dir = "../data/packed-sft"
tokenizer_path = "../data/tokenizer/tokenizer.json"
output_dir = "../runs/sft-1b"
init_checkpoint = "../runs/pretrain-1b/latest.pt"

[model]
vocab_size = 32768
hidden_size = 2048
num_layers = 22
num_heads = 16
num_kv_heads = 4
intermediate_size = 5504
max_seq_len = 1024
dropout = 0.0
rope_theta = 10000.0
tie_embeddings = true

[training]
max_steps = 2000
batch_size = 4
accumulation_steps = 16
learning_rate = 0.00002
weight_decay = 0.1
warmup_steps = 100
min_lr_ratio = 0.1
lr_schedule = "cosine"
grad_clip = 1.0
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_epsilon = 1e-8
optimizer_fused = true
seed = 42
device = "auto"
precision = "bf16"
activation_checkpointing = true
data_workers = 4
pin_memory = true
save_every = 200
eval_every = 200
eval_batches = 16
keep_checkpoints = 3
deterministic = true
log_every = 10
