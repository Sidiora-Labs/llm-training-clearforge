# Nominal size; inspect the exact parameter count with clearforge doctor.
stage = "pretrain"
data_dir = "../data/packed-pretrain"
tokenizer_path = "../data/tokenizer/tokenizer.json"
output_dir = "../runs/pretrain-1b"

[model]
vocab_size = 32768
hidden_size = 2048
num_layers = 22
num_heads = 16
num_kv_heads = 4
intermediate_size = 5504
max_seq_len = 1024
dropout = 0.0
rope_theta = 10000.0
tie_embeddings = true

[training]
max_steps = 10000
batch_size = 1
accumulation_steps = 32
learning_rate = 0.0003
weight_decay = 0.1
warmup_steps = 100
min_lr_ratio = 0.1
grad_clip = 1.0
seed = 42
device = "auto"
precision = "bf16"
save_every = 100
eval_every = 100
eval_batches = 10
deterministic = true
